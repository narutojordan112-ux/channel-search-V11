94號","地區":"宜蘭縣羅東鎮"},{"通路":"永豐","分行名稱":"羅東分行","地址":"宜蘭縣羅東鎮中正路205號","地區":"宜蘭縣羅東鎮"},{"通路":"土銀","分行名稱":"羅東分行","地址":"宜蘭縣羅東鎮公正路158號","地區":"宜蘭縣羅東鎮"},{"通路":"台銀","分行名稱":"羅東分行","地址":"宜蘭縣羅東鎮林森路68號","地區":"宜蘭縣羅東鎮"},{"通路":"兆豐","分行名稱":"羅東分行","地址":"宜蘭縣羅東鎮純精路二段195號","地區":"宜蘭縣羅東鎮"},{"通路":"一銀","分行名稱":"蘇澳分行","地址":"宜蘭縣蘇澳鎮中山路1段12號","地區":"宜蘭縣蘇澳鎮"},{"通路":"彰銀","分行名稱":"蘇澳分行","地址":"宜蘭縣蘇澳鎮中山路一段121號1、2樓","地區":"宜蘭縣蘇澳鎮"},{"通路":"台銀","分行名稱":"蘇澳分行","地址":"宜蘭縣蘇澳鎮中山路一段97號","地區":"宜蘭縣蘇澳鎮"},{"通路":"土銀","分行名稱":"蘇澳分行","地址":"宜蘭縣蘇澳鎮太平路17號"}
        ];

        // *** 自動清洗資料：移除空白 & 刪除重複 ***
        const ALL_DATA = RAW_DATA
            .map(item => ({
                "通路": item["通路"].trim(),
                "分行名稱": item["分行名稱"].trim(),
                "地址": item["地址"].trim(),
                "地區": item["地區"].trim()
            }))
            .filter((item, index, self) =>
                index === self.findIndex((t) => (
                    t["通路"] === item["通路"] && t["分行名稱"] === item["分行名稱"]
                ))
            );

        const RESULTS_BODY = document.getElementById('results-body');
        const RESULTS_COUNT = document.getElementById('results-count');

        function initializeFilters() {
            // 提取並排序，確保唯一性
            const uniqueChannels = [...new Set(ALL_DATA.map(item => item['通路']))].sort();
            const uniqueAreas = [...new Set(ALL_DATA.map(item => item['地區']))].filter(a => a).sort();

            renderCheckboxes(uniqueChannels, 'channel-list', 'channel');
            renderCheckboxes(uniqueAreas, 'area-list', 'area');
            searchData();
        }

        function renderCheckboxes(items, containerId, name) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            const selectAllDiv = document.createElement('div');
            selectAllDiv.innerHTML = `
                <label style="font-weight:bold; color:#007bff;">
                    <input type="checkbox" onchange="toggleAll('${name}', this.checked)"> 全選 / 清除
                </label>
                <hr style="margin: 5px 0; border: 0; border-top: 1px solid #eee;">
            `;
            container.appendChild(selectAllDiv);

            items.forEach(item => {
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" name="${name}" value="${item}" onchange="searchData()"> ${item}`;
                container.appendChild(label);
            });
        }
        
        function toggleAll(name, checked) {
            const checkboxes = document.querySelectorAll(`input[name="${name}"]`);
            checkboxes.forEach(cb => {
                cb.checked = checked;
            });
            searchData();
        }

        function searchData() {
            const keyword = document.getElementById('keyword-input').value.toLowerCase().trim();
            const selectedChannels = Array.from(document.querySelectorAll('input[name="channel"]:checked')).map(cb => cb.value);
            const selectedAreas = Array.from(document.querySelectorAll('input[name="area"]:checked')).map(cb => cb.value);

            const filteredData = ALL_DATA.filter(item => {
                const channelMatch = selectedChannels.length === 0 || selectedChannels.includes(item['通路']);
                const areaMatch = selectedAreas.length === 0 || selectedAreas.includes(item['地區']);
                const keywordMatch = !keyword || 
                                     item['通路'].toLowerCase().includes(keyword) || 
                                     item['分行名稱'].toLowerCase().includes(keyword) || 
                                     item['地址'].toLowerCase().includes(keyword) ||
                                     item['地區'].toLowerCase().includes(keyword);

                return channelMatch && areaMatch && keywordMatch;
            });

            renderResults(filteredData);
        }

        function renderResults(data) {
            RESULTS_BODY.innerHTML = '';
            RESULTS_COUNT.textContent = `搜尋結果：共 ${data.length} 筆`;

            if (data.length === 0) {
                RESULTS_BODY.innerHTML = '<tr><td colspan="3" style="text-align: center; padding: 20px; color: #666;">沒有符合條件的資料</td></tr>';
                return;
            }

            data.forEach(item => {
                const row = RESULTS_BODY.insertRow();
                row.insertCell().textContent = item['通路'];
                row.insertCell().textContent = item['分行名稱'];
                
                const addressCell = row.insertCell();
                const addressText = item['地址'];
                // *** 修正重點：使用正確的 Google Maps 搜尋 URL 格式，並修正變數插值語法 ***
                const mapUrl = `https://www.google.com/maps?q=${encodeURIComponent(addressText)}`;
                
                const link = document.createElement('a');
                link.href = mapUrl;
                link.target = "_blank";
                link.className = "map-link";
                link.innerHTML = `<span class="map-icon">📍</span>${addressText}`;
                
                addressCell.appendChild(link);
            });
        }

        document.addEventListener('DOMContentLoaded', initializeFilters);
    </script>
